<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Вход — Панель клиентов</title>
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <div class="login-theme" id="theme-toggle"></div>
  <main class="login-wrap">
    <div class="card login-card">
      <h1>Панель клиентов</h1>
      <p class="sub">Вход только для участников проекта.</p>

      <div id="msg" class="msg error" role="alert"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submit" class="btn-primary block" type="submit"><span id="submit-label">Войти</span></button>
      </form>
    </div>
  </main>

  <script type="module" src="/assets/login.js"></script>
</body>
</html>
